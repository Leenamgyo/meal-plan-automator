<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Menu Registration Modal</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #2d5a27; --border: #e0e0e0; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .modal-content { background: white; width: 450px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h2 { margin: 0; font-size: 1.2rem; }
        .close-btn { background: none; border: none; cursor: pointer; color: #888; }

        .registry-form { padding: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; color: #555; }
        .input-group input, .input-group select { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        
        .icon-options { display: flex; gap: 15px; margin-top: 10px; }
        .icon-options .material-icons { padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; color: #888; }
        .icon-options .material-icons.active { border-color: var(--primary); color: var(--primary); background: #f1f8e9; }

        .photo-upload { margin-bottom: 1.5rem; }
        .upload-placeholder { width: 100%; height: 120px; border: 2px dashed #ccc; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; cursor: pointer; }

        .alert-info { background: #f1f8e9; padding: 1rem; border-radius: 8px; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 4px; border: 1px solid #c8e6c9; }
        .alert-info p { margin: 0; font-size: 0.85rem; color: #2e7d32; font-weight: bold; }
        .alert-info small { font-size: 0.75rem; color: #666; }

        .option-toggle { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .toggle-text strong { display: block; font-size: 0.9rem; }
        .toggle-text p { margin: 0; font-size: 0.75rem; color: #888; }

        .modal-footer { display: flex; gap: 10px; margin-top: 2rem; }
        .btn { flex: 1; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
        .btn-secondary { background: #eee; color: #555; }
        .btn-primary { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="modal-content">
        <header class="modal-header">
            <div class="header-left">
                <span class="material-icons" style="color:var(--primary)">restaurant</span>
                <h2>새 메뉴 등록</h2>
            </div>
            <button class="close-btn"><span class="material-icons">close</span></button>
        </header>

        <form class="registry-form">
            <div class="input-group">
                <label>아이템 정체성 선택</label>
                <div class="icon-options">
                    <span class="material-icons active">lunch_dining</span>
                    <span class="material-icons">local_pizza</span>
                    <span class="material-icons">ramen_dining</span>
                    <span class="material-icons">cake</span>
                    <span class="material-icons">egg_alt</span>
                </div>
            </div>

            <div class="photo-upload">
                <div class="upload-placeholder">
                    <span class="material-icons">add_a_photo</span>
                    <span style="font-size:0.8rem; margin-top:5px;">+ 사진 추가</span>
                </div>
            </div>

            <div class="input-group">
                <label>메뉴명</label>
                <input type="text" placeholder="메뉴 이름을 입력하세요" value="가든 샐러드 보울">
                <div class="alert-info">
                    <div style="display:flex; align-items:center; gap:5px;">
                        <span class="material-icons" style="font-size:16px;">info</span>
                        <p>유사한 메뉴 발견: 가든 샐러드, 가든 파스타</p>
                    </div>
                    <small>인벤토리 관리와 식단 계획의 혼선을 방지하기 위해 고유한 이름을 권장합니다.</small>
                </div>
            </div>

            <div class="input-group">
                <label>카테고리</label>
                <select>
                    <option>메인 요리</option>
                    <option>사이드</option>
                    <option selected>샐러드</option>
                    <option>디저트</option>
                </select>
            </div>

            <div class="option-toggle">
                <div class="toggle-text">
                    <strong>지금 바로 식단에 사용</strong>
                    <p>항목을 오늘의 식단 플래너에 즉시 추가합니다</p>
                </div>
                <input type="checkbox" id="use-now" checked>
            </div>

            <footer class="modal-footer">
                <button type="button" class="btn-secondary">취소</button>
                <button type="submit" class="btn-primary">항목 저장</button>
            </footer>
        </form>
    </div>
</body>
</html>
