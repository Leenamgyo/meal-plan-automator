<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Combo Registration Modal</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #2d5a27; --border: #e0e0e0; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .modal-content { background: white; width: 850px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; max-height: 90vh; }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
        .close-btn { background: none; border: none; cursor: pointer; color: #888; }

        .combo-registry-grid { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
        
        .selection-panel { padding: 1.5rem; border-right: 1px solid var(--border); overflow-y: auto; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; color: #555; }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        
        .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .tag { background: #f0f0f0; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
        .tag .material-icons { font-size: 14px; cursor: pointer; }

        .menu-search-list { margin-top: 2rem; }
        .search-bar { display: flex; align-items: center; background: #f0f0f0; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .search-bar input { border: none; background: transparent; outline: none; flex: 1; margin-left: 8px; }
        .scroll-list { height: 300px; overflow-y: auto; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5; border-radius: 8px; }
        .list-item:hover { background: #f9f9f9; }
        .item-info strong { display: block; font-size: 0.9rem; }
        .item-info span { font-size: 0.75rem; color: #888; }
        .add-btn { color: var(--primary); background: none; border: none; cursor: pointer; }

        .selected-panel { padding: 1.5rem; background: #fafafa; display: flex; flex-direction: column; }
        .selected-panel h3 { margin: 0 0 1.5rem; font-size: 1rem; color: #333; }
        .selected-list { list-style: none; padding: 0; margin: 0; flex: 1; }
        .selected-list li { background: white; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { color: #ff5252; background: none; border: none; cursor: pointer; }

        .alert-warning { background: #fff3e0; border: 1px solid #ffe0b2; padding: 1rem; border-radius: 8px; margin-top: 1rem; display: flex; gap: 12px; }
        .alert-warning .material-icons { color: #f57c00; }
        .alert-text strong { display: block; font-size: 0.85rem; color: #e65100; margin-bottom: 2px; }
        .alert-text p { margin: 0; font-size: 0.75rem; color: #666; }

        .btn-primary { background: var(--primary); color: white; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="modal-content">
        <header class="modal-header">
            <h2>REGISTER COMBO MENU</h2>
            <button class="close-btn"><span class="material-icons">close</span></button>
        </header>

        <div class="combo-registry-grid">
            <div class="selection-panel">
                <div class="input-group">
                    <label>콤보명</label>
                    <input type="text" placeholder="콤보 이름을 입력하세요" value="가든 프레시 세트">
                </div>
                <div class="input-group">
                    <label>태그</label>
                    <div class="tags">
                        <span class="tag">Vegan <span class="material-icons">close</span></span>
                        <span class="tag">High-Protein <span class="material-icons">close</span></span>
                    </div>
                </div>

                <div class="menu-search-list">
                    <label>개별 메뉴 선택</label>
                    <div class="search-bar">
                        <span class="material-icons" style="font-size:20px; color:#888;">search</span>
                        <input type="text" placeholder="메뉴 검색...">
                    </div>
                    <div class="scroll-list">
                        <div class="list-item">
                            <div class="item-info">
                                <strong>ZESTY AVOCADO BOWL</strong>
                                <span>샐러드</span>
                            </div>
                            <button class="add-btn"><span class="material-icons">add_circle</span></button>
                        </div>
                        <div class="list-item">
                            <div class="item-info">
                                <strong>SPICED LENTIL BROTH</strong>
                                <span>사이드/수프</span>
                            </div>
                            <button class="add-btn"><span class="material-icons">add_circle</span></button>
                        </div>
                        <div class="list-item">
                            <div class="item-info">
                                <strong>QUINOA MEDLEY</strong>
                                <span>사이드</span>
                            </div>
                            <button class="add-btn"><span class="material-icons" style="color:#ccc;">check_circle</span></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="selected-panel">
                <h3>선택된 메뉴 3개 항목 추가됨</h3>
                <ul class="selected-list">
                    <li>
                        <span>Zesty Avocado Bowl</span>
                        <button class="remove-btn"><span class="material-icons">delete_outline</span></button>
                    </li>
                    <li>
                        <span>Spiced Lentil Broth</span>
                        <button class="remove-btn"><span class="material-icons">delete_outline</span></button>
                    </li>
                    <li>
                        <span>Quinoa Medley</span>
                        <button class="remove-btn"><span class="material-icons">delete_outline</span></button>
                    </li>
                </ul>

                <div class="alert-warning">
                    <span class="material-icons">warning</span>
                    <div class="alert-text">
                        <strong>이미 동일한 조합이 존재합니다</strong>
                        <p>이 메뉴 조합은 이미 'The Wellness Trio'로 등록되어 있습니다.</p>
                    </div>
                </div>

                <button class="btn-primary">
                    콤보 등록하기 <span class="material-icons">auto_awesome</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
