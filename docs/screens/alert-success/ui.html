<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Success Alert</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #4CAF50; --bg: #f8f9fa; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .modal-overlay { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .alert-card { background: white; border-radius: 16px; padding: 2rem; text-align: center; max-width: 400px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); width: 90%; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        .brand { font-weight: 800; color: #2d5a27; font-size: 0.9rem; letter-spacing: 1px; }
        .icons { color: #888; display: flex; gap: 10px; }
        .icons .material-icons { font-size: 20px; }

        .content .status-icon { color: var(--primary); font-size: 64px; margin-bottom: 1.5rem; }
        .content h2 { margin: 0 0 10px; font-size: 1.5rem; letter-spacing: 2px; color: #333; }
        .content p { margin: 0 0 2rem; color: #666; line-height: 1.6; font-size: 0.95rem; }

        .btn-confirm { background: var(--primary); color: white; border: none; padding: 1rem 3rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        .btn-confirm:hover { background: #43a047; }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="alert-card success">
            <div class="header">
                <span class="brand">THE LIVING KITCHEN</span>
                <div class="icons">
                    <i class="material-icons">notifications</i>
                    <i class="material-icons">account_circle</i>
                </div>
            </div>
            
            <div class="content">
                <i class="material-icons status-icon">check_circle</i>
                <h2>SUCCESS</h2>
                <p>Your menu item has been saved to your personal digital garden.</p>
            </div>
            
            <div class="actions">
                <button class="btn-confirm">Confirm</button>
            </div>
        </div>
    </div>
</body>
</html>
