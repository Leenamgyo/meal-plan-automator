<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Restaurant Profile Settings</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #2d5a27; --bg: #ffffff; --border: #e0e0e0; --text: #333; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; color: var(--text); background: #fafafa; }
        
        .settings-container { display: flex; flex-direction: column; height: 100vh; }
        .settings-header { background: white; padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .title-group { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: bold; }
        .settings-title { display: flex; align-items: center; gap: 8px; color: #666; font-size: 0.9rem; }

        .settings-tabs { background: white; padding: 0 2rem; border-bottom: 1px solid var(--border); display: flex; gap: 2rem; }
        .tab { padding: 1rem 0; display: flex; align-items: center; gap: 8px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; font-size: 0.95rem; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }

        .settings-content { flex: 1; padding: 3rem; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .config-section { background: white; padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .section-header h3 { margin: 0; font-size: 1.4rem; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .form-group { margin-bottom: 2rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.6rem; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        .form-group textarea { height: 120px; line-height: 1.6; resize: none; }
        .label-with-icon { display: flex; align-items: center; gap: 6px; margin-bottom: 0.6rem; }
        .label-with-icon .material-icons { font-size: 18px; color: #888; }
        .label-with-icon label { margin-bottom: 0; }

        .system-status { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); color: #999; font-size: 0.85rem; }
        .system-status p { margin: 0 0 5px; }
        .footer-actions { margin-top: 1rem; display: flex; gap: 1rem; }
        .btn-link { background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; color: #666; cursor: pointer; }
    </style>
</head>
<body>
    <div class="settings-container">
        <header class="settings-header">
            <div class="title-group">
                <span class="material-icons">restaurant</span>
                <h1 style="margin:0; font-size:1.1rem; letter-spacing:1px;">THE LIVING KITCHEN</h1>
            </div>
            <div class="settings-title">
                <span class="material-icons" style="font-size:18px;">settings</span>
                <h2 style="margin:0; font-size:0.9rem; font-weight:normal;">SETTINGS</h2>
            </div>
        </header>

        <nav class="settings-tabs">
            <div class="tab active">
                <span class="material-icons" style="font-size:20px;">storefront</span>
                <span>Restaurant Profile</span>
            </div>
            <div class="tab">
                <span class="material-icons" style="font-size:20px;">category</span>
                <span>Category Management</span>
            </div>
            <div class="tab">
                <span class="material-icons" style="font-size:20px;">terminal</span>
                <span>AI Prompt Management</span>
            </div>
        </nav>

        <main class="settings-content">
            <section class="config-section">
                <div class="section-header">
                    <h3>식당 프로필 설정</h3>
                    <button class="btn-save">변경 사항 저장</button>
                </div>

                <div class="form-group">
                    <label>식당 공식 명칭</label>
                    <input type="text" value="THE LIVING KITCHEN">
                </div>

                <div class="form-group">
                    <label>대표 전화번호</label>
                    <input type="tel" placeholder="02-xxxx-xxxx" value="02-1234-5678">
                </div>

                <div class="form-group">
                    <div class="label-with-icon">
                        <span class="material-icons">description</span>
                        <label>식당 소개 문구</label>
                    </div>
                    <textarea>자연의 활력을 식탁으로 옮겨오는 'The Living Kitchen'입니다. 엄선된 로컬 식재료와 현대적인 요리 기법을 결합하여 몸과 마음이 즐거운 미식 경험을 선사합니다.</textarea>
                </div>
            </section>

            <footer class="system-status">
                <p>시스템 상태: <span style="color:#4caf50; font-weight:bold;">정상 (로컬)</span></p>
                <p>마지막 업데이트: 2024-05-20 14:32</p>
                <div class="footer-actions">
                    <button class="btn-link">시스템 매뉴얼</button>
                    <button class="btn-link">데이터 백업</button>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
