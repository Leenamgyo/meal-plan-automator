<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Planner (Collapsed)</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --sidebar-width: 240px;
        }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: #f8f9fa; }
        
        .sidebar { width: var(--sidebar-width); background: #f8f9fa; border-right: 1px solid #dee2e6; padding: 20px; }
        .logo { font-weight: bold; font-size: 1.2rem; margin-bottom: 30px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .calendar-container { background: white; border-radius: 12px; border: 1px solid #eee; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); flex: 1; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #eee; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
        .calendar-day-head { background: #f8f9fa; padding: 15px; text-align: center; font-weight: bold; color: #555; }
        .calendar-day { background: white; min-height: 120px; padding: 15px; }

        .collapsed-trigger { position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: white; border: 1px solid #eee; border-right: none; padding: 15px 5px; border-radius: 8px 0 0 8px; cursor: pointer; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
        .guide-footer { margin-top: 30px; display: flex; gap: 30px; color: #666; font-size: 0.95rem; }
        .guide-item { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">The Living Kitchen</div>
        <div>Planner</div>
    </nav>

    <main class="main-content">
        <div class="header">
            <h2 style="margin:0;">Monthly Planner</h2>
            <div style="display:flex; gap:15px; align-items:center;">
                <span class="material-icons" style="color:#666; cursor:pointer;">search</span>
                <span class="material-icons" style="color:#666; cursor:pointer;">notifications_none</span>
                <div style="width:32px; height:32px; background:#ddd; border-radius:50%;"></div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="calendar-header">
                <div style="display:flex; align-items:center; gap:20px;">
                    <h3 style="margin:0; font-size:1.5rem;">October 2024</h3>
                    <div style="display:flex; gap:5px;">
                        <span class="material-icons" style="cursor:pointer; padding:5px; border:1px solid #eee; border-radius:4px;">chevron_left</span>
                        <span class="material-icons" style="cursor:pointer; padding:5px; border:1px solid #eee; border-radius:4px;">chevron_right</span>
                    </div>
                </div>
                <button style="padding:10px 20px; background:#f8f9fa; border:1px solid #ddd; border-radius:6px; cursor:pointer;">Today</button>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-head">Sun</div>
                <div class="calendar-day-head">Mon</div>
                <div class="calendar-day-head">Tue</div>
                <div class="calendar-day-head">Wed</div>
                <div class="calendar-day-head">Thu</div>
                <div class="calendar-day-head">Fri</div>
                <div class="calendar-day-head">Sat</div>
                <div class="calendar-day" style="background:#fcfcfc; color:#ccc;">29</div>
                <div class="calendar-day" style="background:#fcfcfc; color:#ccc;">30</div>
                <div class="calendar-day">1</div>
                <div class="calendar-day">2</div>
                <div class="calendar-day">3</div>
                <div class="calendar-day">4</div>
                <div class="calendar-day">5</div>
                <div class="calendar-day">6</div>
                <!-- ... -->
                <div class="calendar-day" style="grid-column: span 7; min-height:300px; display:flex; align-items:center; justify-content:center; color:#eee; font-size:3rem; font-weight:bold; letter-spacing:10px;">EXPANDED VIEW</div>
            </div>

            <div class="guide-footer">
                <div class="guide-item" style="color:#2196f3; font-weight:bold; cursor:pointer;">
                    <span class="material-icons">chevron_left</span> Open Curation Panel
                </div>
                <div class="guide-item"><span class="material-icons">mouse</span> Click a date to select</div>
                <div class="guide-item"><span class="material-icons">delete</span> Double-click on the calendar to delete</div>
            </div>
        </div>
    </main>

    <div class="collapsed-trigger">
        <span class="material-icons" style="color:#888;">chevron_left</span>
    </div>
</body>
</html>
