<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Kitchen - Confirm Alert</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --warning: #FF9800; --danger: #A63360; --border: #E1E3E4; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .modal-overlay { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .alert-card { background: white; border-radius: 20px; padding: 2.5rem; text-align: center; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; }
        
        .header { margin-bottom: 1.5rem; }
        .brand { font-weight: 800; color: #2d5a27; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }

        .content .status-icon { color: var(--warning); font-size: 72px; margin-bottom: 1rem; }
        .content h2 { margin: 0 0 12px; font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; color: #333; }
        .content p { margin: 0 0 2.5rem; color: #777; line-height: 1.6; font-size: 1rem; }

        .actions { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 1rem; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; border: none; }
        .btn-cancel { background: #f5f5f5; color: #666; border: 1px solid var(--border); }
        .btn-cancel:hover { background: #eeeeee; }
        .btn-confirm-delete { background: var(--danger); color: white; }
        .btn-confirm-delete:hover { background: #8e2a52; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="alert-card warning">
            <div class="header">
                <span class="brand">THE LIVING KITCHEN</span>
            </div>
            
            <div class="content">
                <i class="material-icons status-icon">warning</i>
                <h2>ARE YOU SURE?</h2>
                <p>Do you want to delete this menu item?<br>This action cannot be undone.</p>
            </div>
            
            <div class="actions">
                <button class="btn btn-cancel">Cancel</button>
                <button class="btn btn-confirm-delete">Confirm</button>
            </div>
        </div>
    </div>
</body>
</html>
